name: Comprobar versiones de assets

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar que los JS compartidos llevan su ?v=hash actual
        run: python3 scripts/bump_assets.py --check
