name: Actualizar lastmod del sitemap

on:
  push:
    branches: [main]
    paths:
      - "**.html"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necesitamos el historial completo para "git log" por archivo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Actualizar lastmod según el último commit de cada página
        run: python3 scripts/update_sitemap_lastmod.py

      - name: Commitear sitemap.xml si cambió
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sin cambios en sitemap.xml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: actualiza lastmod del sitemap [skip ci]"
          git push
