<div class="wrap">
  <h1>Verificar certificado</h1>
  <p class="lead">Introduce el ID que aparece en el certificado, o escanea el código QR incluido en el diploma para verificarlo automáticamente.</p>

  <form class="verify-form" id="verify-form">
    <input type="text" id="cert-id" placeholder="CERT-XXXXXXXX" autocomplete="off" required>
    <button type="submit" id="verify-btn">Verificar</button>
  </form>

  <div class="result" id="result"></div>

  <p class="verify-note">¿Tienes dudas sobre un certificado? Escríbenos por <a href="/profesor-excel-online.html">WhatsApp</a>.</p>
</div>

<script src="/footer.js?v=a1ec7b41"></script>

<script>
(function () {
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbxqJtjvQ08DdWv60GSCu_IpCxhfLntTYXJFjFiWlTnC0I35u4je2ir7qr9dm2cKRd9hcg/exec';

  var form = document.getElementById('verify-form');
  var input = document.getElementById('cert-id');
  var btn = document.getElementById('verify-btn');
  var result = document.getElementById('result');

  var iconOk = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg>';
  var iconFail = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';

  function verificar(id) {
    btn.disabled = true;
    btn.textContent = 'Verificando…';
    result.classList.remove('show');

    fetch(ENDPOINT + '?id=' + encodeURIComponent(id))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.valido) {
          result.innerHTML =
            '<div class="result-header">' + iconOk + ' Certificado válido</div>' +
            '<dl>' +
              '<dt>Nombre</dt><dd>' + data.nombre + '</dd>' +
              '<dt>Programa</dt><dd>' + data.programa + '</dd>' +
              '<dt>Horas</dt><dd>' + data.horas + 'h</dd>' +
              '<dt>Fecha de emisión</dt><dd>' + data.fecha + '</dd>' +
            '</dl>';
          result.className = 'result show valid';
        } else {
          result.innerHTML = '<div class="result-header">' + iconFail + ' Certificado no encontrado</div><p style="font-size:0.85rem;color:var(--muted)">Revisa que el ID esté escrito correctamente, tal como aparece en el diploma.</p>';
          result.className = 'result show invalid';
        }
      })
      .catch(function () {
        result.innerHTML = '<div class="result-header">' + iconFail + ' No se pudo verificar</div><p style="font-size:0.85rem;color:var(--muted)">Ha ocurrido un error de conexión. Inténtalo de nuevo en unos segundos.</p>';
        result.className = 'result show invalid';
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = 'Verificar';
      });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = input.value.trim().toUpperCase();
    if (id) verificar(id);
  });

  // Auto-verificar si llega ?id=... (desde el QR del diploma)
  var params = new URLSearchParams(location.search);
  var idParam = params.get('id');
  if (idParam) {
    input.value = idParam.toUpperCase();
    verificar(idParam.toUpperCase());
  }
})();
</script>
